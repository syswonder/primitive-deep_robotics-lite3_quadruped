manifestVersion: 1

package:
  name: robonix.primitive.deep_robotics.lite3.quadruped
  version: 0.2.0
  vendor: robonix
  description: Lite3 quadruped primitive with hardware and MuJoCo backends
  license: Apache-2.0
  tags: [primitive, chassis, deep_robotics, lite3, quadruped, ros2]
  maintainers:
    - Bunnycxk <2501213313@stu.pku.edu.cn>

# cap_id is what shows up in `rbnx caps`. Convention: short name, same
# across the three places it appears (atlas, package, manifest).
capability_id: lite3_quadruped

build: bash scripts/build.sh
start: bash scripts/start.sh

# Built-in chassis contracts (live under <robonix>/capabilities/primitive/chassis/).
# We don't redeclare them locally — primitives reuse the canonical
# contract surface. Only skills need package-local capabilities/.
capabilities:
  - name: robonix/primitive/chassis/driver
  - name: robonix/primitive/chassis/move
  - name: robonix/primitive/chassis/twist_in
  - name: robonix/primitive/chassis/odom
  - name: robonix/primitive/chassis/posture
  # Canonical health contracts (live under <robonix>/capabilities/primitive/health/):
  # chassis telemetry is reported through the Robonix health pipeline (Soma/Vitals).
  - name: robonix/primitive/health/state
  - name: robonix/primitive/health/stream
